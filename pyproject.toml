[build-system]
requires = ["setuptools>=77"]   # 77: a license given as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "smritilila"
version = "0.1.1"
description = "Persistent multiplayer generative world engine"
license = "Apache-2.0"          # Marc, 2026-10-17
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "sentence-transformers>=3.0",
    "pillow>=10",             # reading a map (the builder's, 2026-10-23, and the map proposal) cuts the picture into parts: needed at run time, not only by the tests
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyflakes>=3", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
